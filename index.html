<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>TAU Pharmacology — Interactive Reference</title>
<style>
:root{--bg:#eef1f5;--pg:#fff;--tx:#17212b;--mu:#5b6b7b;--bar:#0b2a4a;--nv:#0b2a4a;--tl:#0e7c86;--gd:#e8a920;--ln:#d5dce4;--hl:#ffe27a;--hd:#c5d0dc;--z:#f3f6f9}
html[data-t=dark]{--bg:#09111a;--pg:#101b29;--tx:#dde5ee;--mu:#93a4b6;--bar:#050d17;--nv:#8fbbea;--tl:#4fc3cd;--ln:#26384a;--hl:#7a5c00;--hd:#2c3e52;--z:#14233a}
*{box-sizing:border-box}html{-webkit-text-size-adjust:100%}[hidden]{display:none!important}[id]{scroll-margin-top:112px}
body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.55 Charter,'Iowan Old Style','Liberation Serif',Georgia,serif}
button,input,textarea{font:inherit;color:inherit}button{cursor:pointer}
.sans,.top,.nav,.side,.ov,.tp,h1,h2,h3,th,.ph,.pf,.toc,.mk{font-family:Carlito,Calibri,'Segoe UI',system-ui,sans-serif}
.top{position:sticky;top:0;z-index:30;background:var(--bar);color:#fff;border-bottom:3px solid var(--gd);padding-top:env(safe-area-inset-top)}
.row{display:flex;align-items:center;gap:6px;padding:6px 10px;flex-wrap:wrap}
.top button,.nav button{background:rgba(255,255,255,.1);color:#fff;border:1px solid rgba(255,255,255,.25);border-radius:7px;min-height:40px;min-width:40px;padding:0 12px}
.top button[aria-pressed=true]{background:var(--tl);border-color:var(--tl)}
.top .t{font-weight:700;font-size:18px;margin-right:auto;letter-spacing:.2px}.t em{color:var(--gd);font-style:normal}
.nav input{width:64px;min-height:40px;text-align:center;border-radius:7px;border:1px solid rgba(255,255,255,.35);background:rgba(255,255,255,.95);color:#111}
.nav{font-size:15px;padding-top:0}
.side{position:fixed;z-index:25;left:0;top:0;bottom:0;width:330px;max-width:90vw;background:var(--pg);border-right:1px solid var(--ln);display:none;flex-direction:column;padding-top:calc(env(safe-area-inset-top) + 108px)}
body.sb .side{display:flex}
.tabs{display:flex;border-bottom:1px solid var(--ln)}.tab{flex:1;background:none;border:0;border-bottom:3px solid transparent;min-height:42px;font-size:14px}.tab[aria-selected=true]{border-color:var(--tl);color:var(--tl);font-weight:700}
#sl{overflow:auto;flex:1;padding:6px 0 40px}
.si{display:flex;gap:8px;justify-content:space-between;padding:8px 14px;text-decoration:none;color:var(--tx);font-size:14.5px;line-height:1.3;border-left:4px solid transparent;flex-wrap:wrap}
.si i{font-style:normal;color:var(--mu)}.si.l1{font-weight:700;border-color:var(--c);margin-top:6px;background:var(--z)}.si.l2{padding-left:26px}.si em{flex-basis:100%;color:var(--mu);font-size:13px}
.si:hover,.si:focus{background:var(--z);outline:0}
main{padding:10px 8px 80px}
@media(min-width:900px){body.sb main{margin-left:330px}}
@media(max-width:899px){body.sb .side{box-shadow:0 0 0 100vmax rgba(0,0,0,.45)}}
.page{background:var(--pg);max-width:860px;margin:12px auto;padding:20px clamp(14px,4vw,34px) 14px;border-top:6px solid var(--ac,var(--nv));box-shadow:0 1px 6px rgba(0,0,0,.12);border-radius:3px;overflow-wrap:anywhere}
body[data-m=page] .page:not(.cur){display:none}
.cv{width:100%;display:block;margin:-20px 0 -14px;max-width:none}
.ph{display:flex;justify-content:space-between;font-size:12.5px;color:var(--mu);border-bottom:1px solid var(--ln);padding-bottom:5px;margin-bottom:12px}
.pf{display:flex;justify-content:space-between;align-items:center;font-size:12.5px;color:var(--mu);border-top:1px solid var(--ln);padding-top:6px;margin-top:18px}
h1,h2,h3{position:relative;line-height:1.25;margin:0}
h1{background:var(--ac,var(--nv));color:#fff;font-size:clamp(22px,4.6vw,28px);padding:12px 40px 12px 16px;margin:4px 0 14px;border-radius:3px}
h2{color:var(--nv);font-size:clamp(18px,3.6vw,21px);padding:6px 36px 5px 0;margin:20px 0 8px;border-bottom:2px solid var(--ac,var(--nv))}
h3{color:var(--tl);font-size:16.5px;margin:15px 0 4px;padding-right:34px}
p{margin:6px 0;position:relative;padding-right:30px}
ul{list-style:none;margin:2px 0 6px;padding:0}
li{position:relative;padding:2px 30px 2px 20px;margin:2px 0}
li::before{content:"";position:absolute;left:3px;top:.72em;width:7px;height:7px;background:var(--ac,var(--nv));border-radius:1px}
b{color:var(--nv)}
.tw{position:relative;overflow-x:auto;margin:10px 0;border:1px solid var(--ln);border-radius:3px;padding-top:2px}
table{border-collapse:collapse;width:100%;min-width:520px;font-size:14.5px;line-height:1.4}
th{background:var(--bar);color:#fff;text-align:left;font-size:14px}th b{color:#fff}
th,td{padding:6px 9px;border-bottom:1px solid var(--ln);vertical-align:top}tr:nth-child(even) td{background:var(--z)}td+td,th+th{border-left:1px solid var(--ln)}
.toc{display:flex;justify-content:space-between;gap:10px;text-decoration:none;color:var(--tx);padding:7px 4px;border-bottom:1px dotted var(--ln);position:relative;font-size:15px}
.toc.l1{font-weight:700;color:var(--nv);margin-top:8px;font-size:16px}.toc.l2{padding-left:20px}.toc i{font-style:normal;color:var(--mu)}.toc:hover{background:var(--z)}
.mk{position:absolute;right:2px;top:2px;width:28px;height:28px;padding:0;border:0;border-radius:6px;background:none;opacity:.28;color:inherit}
.mk::before{content:"⚑";font-size:15px}.mk.on{opacity:1;color:var(--gd)}h1 .mk{color:#fff}.pf .mk{position:static}.tw .mk{right:4px;top:4px;background:var(--pg)}
:hover>.mk,.mk:focus{opacity:.9}@media(hover:none){.mk{opacity:.55}.mk.on{opacity:1}}
mark.hl{background:var(--hl);color:inherit;border-radius:2px;padding:0 1px;box-shadow:0 0 0 2px var(--hl)}
.tgt{animation:fl 2.2s ease-out}@keyframes fl{0%,60%{outline:3px solid var(--gd);outline-offset:2px}100%{outline:3px solid transparent}}
body.r-li li:not(.show),body.r-td td:not(.show),body.r-b b:not(.show){color:transparent!important;background:var(--hd)!important;border-radius:3px;cursor:pointer;user-select:none}
body.r-li li:not(.show) *,body.r-td td:not(.show) *{color:transparent!important}
body.r-b li:not(.show) b{background:none!important}
.ov{position:fixed;inset:0;z-index:50;background:rgba(5,13,23,.6);display:flex;justify-content:center;align-items:flex-start;padding:calc(env(safe-area-inset-top) + 8px) 8px 8px}
.ovb{background:var(--pg);width:min(720px,100%);max-height:calc(100vh - 20px);display:flex;flex-direction:column;border-radius:10px;border-top:4px solid var(--gd);overflow:hidden}
.ovh{padding:10px;display:flex;gap:8px;flex-wrap:wrap;align-items:center;border-bottom:1px solid var(--ln)}
#q{flex:1 1 220px;min-height:44px;border:2px solid var(--tl);border-radius:8px;padding:0 12px;background:var(--pg);font-size:17px}
.seg button,.btn{background:var(--z);border:1px solid var(--ln);border-radius:7px;min-height:40px;padding:0 12px}.seg button[aria-pressed=true]{background:var(--tl);color:#fff;border-color:var(--tl)}
#rc{font-size:13px;color:var(--mu);padding:6px 12px}
#rs{overflow:auto;padding:0 0 10px}
a.r{display:block;padding:9px 14px;border-bottom:1px solid var(--ln);text-decoration:none;color:var(--tx);font-size:15px;line-height:1.4}
a.r b{color:var(--tl);margin-right:8px}a.r small{color:var(--mu)}a.r span{display:block}a.r.sel,a.r:hover{background:var(--z);box-shadow:inset 4px 0 var(--gd)}
.em{color:var(--mu);padding:12px 14px;margin:0}
.tp{position:fixed;z-index:60;left:50%;bottom:0;transform:translateX(-50%);width:min(520px,100%);background:var(--pg);border-top:4px solid var(--gd);border-radius:12px 12px 0 0;padding:14px 14px calc(14px + env(safe-area-inset-bottom));box-shadow:0 -6px 30px rgba(0,0,0,.35)}
.tp textarea{width:100%;min-height:90px;margin:8px 0;border:1px solid var(--ln);border-radius:8px;padding:8px;background:var(--bg)}.tp .g{display:flex;gap:8px;flex-wrap:wrap}.tp .btn{flex:1}
#rp{position:fixed;z-index:40;right:10px;top:calc(env(safe-area-inset-top) + 112px);background:var(--pg);border:1px solid var(--ln);border-top:4px solid var(--tl);border-radius:8px;padding:10px 14px;font-family:Carlito,Calibri,system-ui,sans-serif;box-shadow:0 4px 18px rgba(0,0,0,.3)}
#rp label{display:flex;gap:8px;align-items:center;min-height:36px}
:focus-visible{outline:3px solid var(--gd);outline-offset:1px}
@media print{.top,.side,.mk,#rp{display:none!important}main{margin:0!important}body[data-m=page] .page:not(.cur){display:block}}
</style></head><body data-m="page">
<header class="top"><div class="row"><button id="bm" aria-label="Contents and saved items">☰</button><span class="t">TAU <em>Pharmacology</em></span>
<button id="bs">Search</button><button id="bd">Drug</button><span class="seg" style="display:flex;gap:4px"><button id="mp">Page</button><button id="ms">Scroll</button></span><button id="br" aria-pressed="false">Recall</button><button id="bt" aria-label="Light or dark mode">◐</button></div>
<div class="row nav"><button id="pp" aria-label="Previous page">◀</button><label>Page <input id="pn" type="number" inputmode="numeric" min="0"></label><span id="pt"></span><button id="pg">Go to page</button><button id="px" aria-label="Next page">▶</button></div></header>
<aside class="side" id="sd"><div class="tabs" role="tablist"><button class="tab" data-k="toc">Contents</button><button class="tab" data-k="bm">Bookmarks</button><button class="tab" data-k="fv">Favorites</button><button class="tab" data-k="nt">Notes</button></div><div id="sl"></div></aside>
<div id="rp" hidden><label><input type="checkbox" data-r="r-li" checked> Hide bullets</label><label><input type="checkbox" data-r="r-td"> Hide table cells</label><label><input type="checkbox" data-r="r-b"> Hide bold terms</label><button class="btn" id="ra">Reveal all</button><p class="em" style="padding:6px 0 0">Click any hidden item to reveal it.</p></div>
<main id="book"></main>
<div class="ov" id="ov" hidden><div class="ovb"><div class="ovh"><input id="q" type="search" placeholder="Search the whole book…" autocomplete="off" autocapitalize="off" spellcheck="false"><span class="seg" style="display:flex;gap:4px"><button id="ma">All text</button><button id="md">Drug</button></span><button class="btn" id="oc">Close</button></div><div id="rc"></div><div id="rs"></div></div></div>
<div class="tp" id="tp" hidden><b id="tl"></b><div class="g" style="margin-top:8px"><button class="btn" id="tb"></button><button class="btn" id="tf"></button></div><textarea id="tn" placeholder="Personal note (kept separately; the book text is never changed)"></textarea><div class="g"><button class="btn" id="ts">Save note</button><button class="btn" id="tx">Close</button></div></div>
